services:
  upstream:
    build:
      context: ./without-mappers/src/test/resources
      dockerfile: echo.Dockerfile
  native:
    image: spring-gateway-boundaries-lab:without-mappers
    build:
      context: ./without-mappers
    ports:
      - "127.0.0.1:${NATIVE_PORT:-18081}:8080"
    environment:
      LAB_UPSTREAM_URL: http://upstream:8080
      SPRING_MAIN_BANNER_MODE: "off"
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      upstream:
        condition: service_healthy
  mapped:
    image: spring-gateway-boundaries-lab:with-mappers
    build:
      context: ./with-mappers
    ports:
      - "127.0.0.1:${MAPPED_PORT:-18082}:8080"
    environment:
      LAB_UPSTREAM_URL: http://upstream:8080
      SPRING_MAIN_BANNER_MODE: "off"
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      upstream:
        condition: service_healthy
