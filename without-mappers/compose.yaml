services:
  upstream:
    image: python:3.12-alpine
    command: ["python", "/srv/echo.py"]
    volumes:
      - ./src/test/resources/echo.py:/srv/echo.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
  gateway:
    image: spring-gateway-boundaries-lab:without-mappers
    build: .
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18081}:8080"
    environment:
      LAB_UPSTREAM_URL: http://upstream:8080
      SPRING_MAIN_BANNER_MODE: "off"
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      upstream:
        condition: service_healthy
