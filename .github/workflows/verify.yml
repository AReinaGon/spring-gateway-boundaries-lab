name: Verify boundary contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check Docker availability
        run: docker info
      - name: Run functional and Testcontainers suites
        run: mvn -B clean verify
      - name: Audit duplicated contracts and YAML
        run: python tools/check_equivalence.py
      - name: Compile policies and processors without Spring
        run: python tools/compile_cores.py
      - name: Execute the independent-host policy probes
        run: python tools/probe_boundaries.py
